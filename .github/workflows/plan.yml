name: plan

# Stage 1 of 2. Builds the image, produces a Terraform plan, runs the policy
# gate, uploads the plan as an artifact - and STOPS.
#
# Nothing is created here. The apply workflow consumes this exact plan file,
# so a human approves a specific set of changes rather than an intention.
# Without that split, apply re-plans and can diverge from what was reviewed.

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: 'Environment file stem, e.g. dev or dev-acme'
        required: true
        default: 'dev'
        type: string
      correlation_id:
        description: 'Correlation id - the agent uses this to find its own run'
        required: false
        default: 'manual'
        type: string
  pull_request:
    paths: ['envs/**', 'terraform/**', 'policy/**']

run-name: plan-${{ inputs.env_name || 'dev' }}-${{ inputs.correlation_id || github.event.pull_request.number }}

permissions:
  contents: read
  packages: write
  pull-requests: write
  id-token: write      # required for Workload Identity Federation

env:
  ENV_NAME: ${{ inputs.env_name || 'dev' }}
  REGISTRY: ghcr.io

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read bootstrap config
        id: cfg
        run: |
          # env_name is a free string so the agent can create per-customer
          # environments, so it is validated here instead of by an enum.
          # The pattern blocks path traversal; the existence check means only
          # a committed, reviewed file can ever be planned.
          if ! printf '%s' "$ENV_NAME" | grep -qE '^[a-z][a-z0-9-]{0,39}$'; then
            echo "::error::env_name '$ENV_NAME' is not a valid environment name"
            exit 1
          fi
          test -f "envs/${ENV_NAME}.tfvars" || {
            echo "::error::envs/${ENV_NAME}.tfvars not found - it must be committed first"
            exit 1
          }

          # Values come from repository variables, written by install.sh.
          {
            echo "project_id=${{ vars.GCP_PROJECT_ID }}"
            echo "state_bucket=${{ vars.GCP_STATE_BUCKET }}"
          } >> "$GITHUB_OUTPUT"

      # No service-account key anywhere. The runner exchanges its OIDC token
      # for short-lived GCP credentials, and the WIF provider only trusts
      # tokens carrying this repository.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app1
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/app1:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2    # same pin as local, or plans diverge
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ steps.cfg.outputs.state_bucket }}" \
            -backend-config="prefix=state/${ENV_NAME}"

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan -out=tfplan -input=false \
            -var-file="../envs/${ENV_NAME}.tfvars" \
            -var="image=${{ env.REGISTRY }}/${{ github.repository_owner }}/app1@${{ steps.build.outputs.digest }}"
          terraform show -json tfplan > tfplan.json

      - name: Install policy dependencies
        run: pip install --quiet pyyaml

      # The gate. Reads the plan JSON - what Terraform will actually create -
      # not the .tf source, which a variable value can bypass.
      - name: Policy gate
        id: policy
        run: python3 policy/check_plan.py terraform/tfplan.json --policy policy/policy.yaml --no-colour

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Plan for \`${ENV_NAME}\`"
            echo ""
            if [ "${{ steps.policy.outcome }}" = "success" ]; then
              echo "Policy gate: **passed**"
            else
              echo "Policy gate: **DENIED** - apply will not run, nothing was created"
            fi
            echo ""
            echo "Image: \`${{ env.REGISTRY }}/${{ github.repository_owner }}/app1@${{ steps.build.outputs.digest }}\`"
            echo ""
            echo '<details><summary>Plan output</summary>'
            echo ""
            echo '```'
            terraform -chdir=terraform show -no-color tfplan 2>/dev/null | head -200 || echo "(plan unavailable)"
            echo '```'
            echo '</details>'
            echo ""
            echo "To apply: run the **apply** workflow with run id \`${{ github.run_id }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded only when the gate passed, so a denied plan cannot be applied
      # even by someone dispatching the apply workflow by hand.
      - name: Upload approved plan
        if: steps.policy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENV_NAME }}
          path: |
            terraform/tfplan
            terraform/tfplan.json
          retention-days: 5
          if-no-files-found: error
