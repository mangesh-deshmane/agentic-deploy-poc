# The service catalog. The agent resolves a request against this and nothing
# else - if a combination is not here, the request is rejected.
#
# This is what makes "deploy App1 on AWS" fail cleanly instead of the agent
# improvising a Terraform module it has never seen. Fail closed, always.

version: 1

blueprints:
  app1-gcp:
    app: app1
    cloud: gcp
    display_name: "App1 - Reporting Service"
    description: "Node.js microservice on Cloud Run, Firestore-backed"
    language: nodejs
    platform: cloud-run
    data_store: firestore
    terraform_dir: terraform
    image_repo: ghcr.io/mangesh-deshmane/app1
    runtime_service_account: apoc-app1-runtime
    regions: [us-central1, asia-south1]
    default_region: us-central1

  app2-aws:
    app: app2
    cloud: aws
    display_name: "App2 - Inventory Service"
    description: "Python microservice on Lambda, DynamoDB-backed"
    language: python
    platform: lambda
    data_store: dynamodb
    terraform_dir: terraform-aws
    image_repo: null          # Lambda ships a zip, not an image
    runtime_service_account: null
    regions: [ap-south-1, us-east-1]
    default_region: ap-south-1
    # Phase 5 builds this. Until then the catalog knows it exists but the
    # module does not, so the agent correctly reports it as unavailable.
    available: false

# Combinations deliberately absent, with the reason the agent should give.
# Without these the rejection message is generic; with them it is specific,
# which is the difference between "computer says no" and a useful answer.
known_unsupported:
  app1-aws: "App1 is a container service built for Cloud Run. There is no AWS blueprint for it."
  app2-gcp: "App2 is packaged as a Lambda zip. There is no Cloud Run blueprint for it."
  app1-azure: "Azure is not a registered platform in this deployment."
  app2-azure: "Azure is not a registered platform in this deployment."

environments:
  dev:
    description: "Short-lived demo environment"
    default_ttl_hours: 24
    max_ttl_hours: 168
  test:
    description: "Longer-lived shared environment"
    default_ttl_hours: 72
    max_ttl_hours: 168

# Every deployment inherits these. The policy gate asserts the same values
# against the plan, so changing them here alone will not get past CI.
defaults:
  min_instance_count: 0
  max_instance_count: 2
  memory: "512Mi"
  cpu: "1"
