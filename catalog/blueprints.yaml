# The service catalog. The agent resolves a request against this and nothing
# else - if a combination is not here, the request is rejected.
#
# This is what makes "deploy App1 on AWS" fail cleanly instead of the agent
# improvising a Terraform module it has never seen. Fail closed, always.

version: 1

blueprints:
  app1-gcp:
    app: app1
    cloud: gcp
    display_name: "App1 - Reporting Service"
    description: "Node.js microservice on Cloud Run, Firestore-backed"
    language: nodejs
    platform: cloud-run
    data_store: firestore
    source_dir: app1
    terraform_dir: terraform
    image_repo: ghcr.io/mangesh-deshmane/app1
    runtime_service_account: apoc-app1-runtime
    regions: [us-central1, asia-south1]
    default_region: us-central1

  app2-gcp:
    app: app2
    cloud: gcp
    display_name: "App2 - Inventory Service"
    description: "Python microservice on Cloud Run, Firestore-backed"
    language: python
    platform: cloud-run
    data_store: firestore
    source_dir: app2
    terraform_dir: terraform
    image_repo: ghcr.io/mangesh-deshmane/app2
    runtime_service_account: apoc-app2-runtime
    regions: [us-central1, asia-south1]
    default_region: us-central1

# Combinations deliberately absent, each with the reason the agent should
# give. A generic "not supported" is useless to the person asking; naming the
# actual reason is the difference between a refusal and an answer.
known_unsupported:
  app1-aws: >-
    AWS is not provisioned in this deployment. No AWS account is federated to
    the pipeline, no Terraform module exists for it, and no AWS resource type
    is on the policy allowlist. Nothing was attempted.
  app2-aws: >-
    AWS is not provisioned in this deployment. No AWS account is federated to
    the pipeline, no Terraform module exists for it, and no AWS resource type
    is on the policy allowlist. Nothing was attempted.
  app1-azure: >-
    Azure is not a registered platform. No credentials, module or policy
    entries exist for it.
  app2-azure: >-
    Azure is not a registered platform. No credentials, module or policy
    entries exist for it.

environments:
  dev:
    description: "Short-lived demo environment"
    default_ttl_hours: 24
    max_ttl_hours: 168
  test:
    description: "Longer-lived shared environment"
    default_ttl_hours: 72
    max_ttl_hours: 168

# Every deployment inherits these. The policy gate asserts the same values
# against the plan, so changing them here alone will not get past CI.
defaults:
  min_instance_count: 0
  max_instance_count: 2
  memory: "512Mi"
  cpu: "1"
